name: Sonde orthophotos Wallonie
on:
  push:
    branches: [prep-carte-photo]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://geoservices.wallonie.be/arcgis
          echo "== dossier IMAGERIE"; curl -s "$B/rest/services/IMAGERIE?f=json" | python3 -c "import sys,json;[print(s['name'],s['type']) for s in json.load(sys.stdin)['services']]" | grep -i ortho
          for S in ORTHO_LAST ORTHO_2024 ORTHO_2023_ETE; do echo "== $S cache"; curl -s "$B/rest/services/IMAGERIE/$S/MapServer?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('cache',d.get('singleFusedMapCache'),'sr',d.get('spatialReference'),'err',d.get('error'))"
            echo "== $S WMS CRS"; curl -s "$B/services/IMAGERIE/$S/MapServer/WMSServer?request=GetCapabilities&service=WMS" | grep -o "<CRS>[^<]*</CRS>" | sort -u | head -12; done
          for S in ORTHO_LAST ORTHO_2024 ORTHO_2025_PRINTEMPS ORTHO_2026_PRINTEMPS; do for Z in "471800,6474000,472400,6474600" "470000,6472000,476000,6478000"; do echo "== $S $Z"; curl -s -o /tmp/t.jpg -w "%{http_code} %{content_type} %{size_download}\n" "$B/services/IMAGERIE/$S/MapServer/WMSServer?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=0&STYLES=&FORMAT=image/jpeg&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX=$Z"; done; done
          curl -s "$B/rest/services/IMAGERIE?f=json" | python3 -c "import sys,json;print([s['name'] for s in json.load(sys.stdin)['services'] if 'ORTHO_20' in s['name'] and 'MAILLAGE' not in s['name'] and 'FOOT' not in s['name']][-8:])"
          curl -s "$B/rest/services/IMAGERIE/ORTHO_LAST/MapServer?f=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('desc',d.get('serviceDescription','')[:300]);print('copy',d.get('copyrightText'));print('doc',d.get('documentInfo'))"
