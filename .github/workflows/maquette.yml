name: Maquette carte (captures avec tuiles)
on:
  push:
    branches: [prep-carte-photo]
    paths: ["tools/maquette/**", ".github/workflows/maquette.yml"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i -s --no-save playwright@1.49.1 && npx playwright install --with-deps chromium >/dev/null
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2; node tools/maquette/run.js out
      - name: Publier les captures sur la branche
        run: |
          git config user.name "chasselog-bot"; git config user.email "contact.chasselog@gmail.com"
          mkdir -p tools/maquette/out && cp out/*.png tools/maquette/out/
          git add tools/maquette/out && git commit -qm "Maquette : captures Plan / Photo" && git push -q origin HEAD:prep-carte-photo
