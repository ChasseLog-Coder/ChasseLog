name: Android (fichier Google Play)
# Construit l'application Android (Capacitor) à partir de l'app web et dépose le fichier .aab NON signé sur la branche « apk-builds ».
# Aucune clé dans ce dépôt public : la signature se fait hors de GitHub avec la clé d'importation Google Play.
on:
  workflow_dispatch:
  push:
    branches: [prep-capacitor]
    paths: ["index.html", "data/**", "animals/**", "weapons/**", "tour/**", "lib/**", "icons/**", "capacitor/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: SDK Android (déjà présent sur le serveur GitHub)
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 12
      - name: Préparer le projet Android
        working-directory: capacitor
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund
            npm ls --depth=0
            npm run www
            npx cap add android
            npx cap sync android
            VERSION_CODE=${{ github.run_number }} npm run native
          } 2>&1 | tee ../build.log
      - name: Construire le fichier Google Play (.aab)
        working-directory: capacitor/android
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee -a ../../build.log
      - name: Publier sur la branche apk-builds
        if: always()
        run: |
          git config user.name "chasselog-bot"; git config user.email "contact.chasselog@gmail.com"
          mkdir -p /tmp/out
          V=$(grep -o 'const APP_V="[^"]*"' index.html | cut -d'"' -f2)
          AAB=$(ls capacitor/android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ]; then cp "$AAB" /tmp/out/chasselog-$V-build${{ github.run_number }}-a-signer.aab; R=ok; else R=echec; fi
          MAP=$(ls capacitor/android/app/build/outputs/mapping/release/mapping.txt 2>/dev/null | head -1 || true)
          if [ -n "$MAP" ]; then cp "$MAP" /tmp/out/mapping-build${{ github.run_number }}.txt; fi
          tail -c 400000 build.log > /tmp/out/build.log 2>/dev/null || true
          cp capacitor/android/app/src/main/AndroidManifest.xml /tmp/out/ 2>/dev/null || true
          printf 'resultat=%s\nversion=%s\nbuild=%s\ncommit=%s\ndate=%s\n' "$R" "$V" "${{ github.run_number }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > /tmp/out/info.txt
          git checkout --orphan apk-builds-tmp; git rm -rqf . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + ; cp /tmp/out/* .
          git add -A; git commit -qm "APK test $V (build ${{ github.run_number }}, $R)"
          git push -qf origin HEAD:apk-builds
