name: Arrêtés chasse France
# Récupère le texte des arrêtés départementaux d'ouverture/clôture et le dépose sur la branche « arretes-fr ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/fr/fetch.sh", "tools/fr/deps.tsv"]
  schedule:
    - cron: "17 5 * 6-9 1"   # chaque lundi de juin à septembre (nouveaux arrêtés)
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-fra >/dev/null
      - run: timeout 70m bash tools/fr/fetch.sh || true
      - name: Publier sur la branche arretes-fr
        if: always()
        run: |
          git config user.name "chasselog-bot"; git config user.email "contact.chasselog@gmail.com"
          [ -f out/index.tsv ] || cat out/row/* > out/index.tsv 2>/dev/null; rm -rf out/pdf out/row
          [ $(wc -l < out/index.tsv) -ge 90 ] || { echo "Récupération incomplète : rien publié"; exit 0; }
          mv out /tmp/out
          git fetch origin arretes-fr || true
          if git rev-parse --verify origin/arretes-fr >/dev/null 2>&1; then git checkout -B arretes-fr origin/arretes-fr; else git checkout --orphan arretes-fr; git rm -rqf .; fi
          rm -rf txt index.tsv; cp -r /tmp/out/* .
          date -u +%F > fetched.txt
          git add -A
          if git diff --cached --quiet -- txt index.tsv; then echo "Aucun changement"; else git commit -qm "Arrêtés France : mise à jour $(date -u +%F)"; git push -q origin arretes-fr; fi
