async function natKeep(f){const FS=NP("Filesystem");if(!FS)return false;try{await FS.writeFile({path:"ChasseLog/"+safeName(f.name),data:await b64of(f),directory:"DOCUMENTS",recursive:true});return true}catch(e){return false}}

 {const K=NP("Keyboard");if(K)try{K.addListener("keyboardDidShow",()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))setTimeout(()=>a.scrollIntoView({block:"center",behavior:"smooth"}),30)})}catch(e){}}addEventListener("unhandledrejection",e=>oops((e.reason&&(e.reason.message||e.reason))||"Erreur"));
